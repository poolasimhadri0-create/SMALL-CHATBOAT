services:
  # MySQL 8 Database Service
  mysql:
    image: mysql:8.0
    container_name: chatbot_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gemini_chatbot_db
      MYSQL_USER: chatbot_user
      MYSQL_PASSWORD: chatbot_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chatbot_net

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://chatbot_user:chatbot_password@mysql:3306/gemini_chatbot_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6IeXF3bOtwYmoi3YJsiPQwfnGS74hHfMhwNxd9Uds8ZJA}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chatbot_net

  # React 19 Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chatbot_net

volumes:
  mysql_data:
    name: chatbot_mysql_data
  uploads_data:
    name: chatbot_uploads_data

networks:
  chatbot_net:
    name: chatbot_network
    driver: bridge
